<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-labelledby="t d">
<title id="t">Drowsiness detection</title>
<desc id="d">ASCII plot, illustrative. Eye aspect ratio blinks stay above a limit; one long closure drops below it and raises an alert.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#14181b}.d{fill:#566168}.c{fill:#0f766e}.l{fill:#4d7c0f}
.ln{fill:none;stroke:#cfd8dc;stroke-width:1}
.ar{fill:none;stroke:#566168;stroke-width:1.4}
.sc{fill:none;stroke:#0f766e;stroke-width:2;stroke-linejoin:round}
.box{fill:#ffffff;stroke:#cfd8dc;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#0f766e;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#4d7c0f}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.blink{animation:blink 1.1s steps(1) infinite}
.fadein{animation:rise .9s ease-out both}
.seq{animation:seq 3.6s ease-in-out infinite}
.s1{animation-delay:.6s}.s2{animation-delay:1.2s}.s3{animation-delay:1.8s}
.altA{opacity:0;animation:altA 7s ease-in-out infinite}
.altB{animation:altB 7s ease-in-out infinite}
.scan{animation:scan 6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes seq{0%,100%{opacity:.4}15%,45%{opacity:1}}
@keyframes altA{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes altB{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(520px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#566168"/></marker></defs>

<rect x=".5" y=".5" width="439" height="149" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
<text x="18" y="26" class="l" font-size="12" text-anchor="start" >checkpoint_04</text>
<text x="422" y="26" class="d" font-size="12" text-anchor="end" >computer vision</text>
<path class="ln" d="M0 38H440"/>
<text y="70" font-size="13"><tspan x="20.0" class="c">*</tspan><tspan x="27.8" class="c">*</tspan><tspan x="35.6" class="c">*</tspan><tspan x="43.4" class="c">*</tspan><tspan x="51.2" class="c">*</tspan><tspan x="74.6" class="c">*</tspan><tspan x="82.4" class="c">*</tspan><tspan x="90.2" class="c">*</tspan><tspan x="98.0" class="c">*</tspan><tspan x="105.8" class="c">*</tspan><tspan x="113.6" class="c">*</tspan><tspan x="121.4" class="c">*</tspan><tspan x="144.8" class="c">*</tspan><tspan x="152.6" class="c">*</tspan><tspan x="160.4" class="c">*</tspan><tspan x="168.2" class="c">*</tspan><tspan x="176.0" class="c">*</tspan><tspan x="183.8" class="c">*</tspan><tspan x="191.6" class="c">*</tspan><tspan x="199.4" class="c">*</tspan><tspan x="277.4" class="c">*</tspan><tspan x="285.2" class="c">*</tspan><tspan x="293.0" class="c">*</tspan><tspan x="300.8" class="c">*</tspan><tspan x="308.6" class="c">*</tspan><tspan x="332.0" class="d">EAR</tspan></text>
<text y="87" font-size="13"><tspan x="59.0" class="d">|</tspan><tspan x="66.8" class="d">|</tspan><tspan x="129.2" class="d">|</tspan><tspan x="137.0" class="d">|</tspan><tspan x="207.2" class="d">|</tspan><tspan x="222.8" class="d">closed</tspan><tspan x="269.6" class="d">|</tspan></text>
<text y="104" font-size="13"><tspan x="59.0" class="c">*</tspan><tspan x="66.8" class="c">*</tspan><tspan x="129.2" class="c">*</tspan><tspan x="137.0" class="c">*</tspan><tspan x="207.2" class="d">|</tspan><tspan x="269.6" class="d">|</tspan></text>
<text y="121" font-size="13"><tspan x="20.0" class="d">.</tspan><tspan x="27.8" class="d"> </tspan><tspan x="35.6" class="d">.</tspan><tspan x="43.4" class="d"> </tspan><tspan x="51.2" class="d">.</tspan><tspan x="59.0" class="d"> </tspan><tspan x="66.8" class="d">.</tspan><tspan x="74.6" class="d"> </tspan><tspan x="82.4" class="d">.</tspan><tspan x="90.2" class="d"> </tspan><tspan x="98.0" class="d">.</tspan><tspan x="105.8" class="d"> </tspan><tspan x="113.6" class="d">.</tspan><tspan x="121.4" class="d"> </tspan><tspan x="129.2" class="d">.</tspan><tspan x="137.0" class="d"> </tspan><tspan x="144.8" class="d">.</tspan><tspan x="152.6" class="d"> </tspan><tspan x="160.4" class="d">.</tspan><tspan x="168.2" class="d"> </tspan><tspan x="176.0" class="d">.</tspan><tspan x="183.8" class="d"> </tspan><tspan x="191.6" class="d">.</tspan><tspan x="199.4" class="d"> </tspan><tspan x="207.2" class="d">.</tspan><tspan x="207.2" class="d">|</tspan><tspan x="215.0" class="d"> </tspan><tspan x="222.8" class="d">.</tspan><tspan x="230.6" class="d"> </tspan><tspan x="238.4" class="d">.</tspan><tspan x="246.2" class="d"> </tspan><tspan x="254.0" class="d">.</tspan><tspan x="261.8" class="d"> </tspan><tspan x="269.6" class="d">.</tspan><tspan x="269.6" class="d">|</tspan><tspan x="277.4" class="d"> </tspan><tspan x="285.2" class="d">.</tspan><tspan x="293.0" class="d"> </tspan><tspan x="300.8" class="d">.</tspan><tspan x="308.6" class="d"> </tspan><tspan x="316.4" class="d">.</tspan><tspan x="324.2" class="d"> </tspan><tspan x="332.0" class="d">.</tspan><tspan x="339.8" class="d"> </tspan><tspan x="363.2" class="d">limit</tspan></text>
<text y="138" font-size="13"><tspan x="207.2" class="c">*</tspan><tspan x="215.0" class="c">*</tspan><tspan x="222.8" class="c">*</tspan><tspan x="230.6" class="c">*</tspan><tspan x="238.4" class="c">*</tspan><tspan x="246.2" class="c">*</tspan><tspan x="254.0" class="c">*</tspan><tspan x="261.8" class="c">*</tspan><tspan x="269.6" class="c">*</tspan><tspan x="285.2" class="l blink">&lt;- ALERT</tspan></text>
</svg>
