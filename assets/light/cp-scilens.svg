<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-labelledby="t d">
<title id="t">SciLens pipeline</title>
<desc id="d">Four paper sources feed an extraction step, then a critic that loops back to targeted re-search before a gap is reported.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#14181b}.d{fill:#566168}.c{fill:#0f766e}.l{fill:#4d7c0f}
.ln{fill:none;stroke:#cfd8dc;stroke-width:1}
.ar{fill:none;stroke:#566168;stroke-width:1.4}
.sc{fill:none;stroke:#0f766e;stroke-width:2;stroke-linejoin:round}
.box{fill:#ffffff;stroke:#cfd8dc;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#0f766e;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#4d7c0f}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.blink{animation:blink 1.1s steps(1) infinite}
.fadein{animation:rise .9s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#566168"/></marker></defs>

<rect x=".5" y=".5" width="439" height="149" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
<text x="18" y="26" class="l" font-size="12" text-anchor="start" >checkpoint_01</text>
<text x="422" y="26" class="d" font-size="12" text-anchor="end" >research agent</text>
<path class="ln" d="M0 38H440"/>
<text x="18" y="62" class="d" font-size="11" text-anchor="start" >OpenAlex</text>
<path class="ln" d="M130 58L196 98"/>
<path class="flow" pathLength="100" d="M130 58L196 98" style="animation-delay:0.0s;"/>
<text x="18" y="82" class="d" font-size="11" text-anchor="start" >Semantic Scholar</text>
<path class="ln" d="M130 78L196 98"/>
<path class="flow lm" pathLength="100" d="M130 78L196 98" style="animation-delay:0.7s;"/>
<text x="18" y="102" class="d" font-size="11" text-anchor="start" >CrossRef</text>
<path class="ln" d="M130 98L196 98"/>
<path class="flow" pathLength="100" d="M130 98L196 98" style="animation-delay:1.4s;"/>
<text x="18" y="122" class="d" font-size="11" text-anchor="start" >arXiv</text>
<path class="ln" d="M130 118L196 98"/>
<path class="flow lm" pathLength="100" d="M130 118L196 98" style="animation-delay:2.0999999999999996s;"/>
<rect class="box" x="196" y="82" width="74" height="32"/><text x="233" y="102" class="t" font-size="12" text-anchor="middle" >extract</text>
<path class="ln" d="M270 98H316"/><path class="flow" pathLength="100" d="M270 98H316" style="animation-delay:0.4s;"/>
<rect class="box" x="316" y="82" width="62" height="32"/><text x="347" y="102" class="c" font-size="12" text-anchor="middle" >critic</text>
<path class="ar dash" d="M347 82V66H233V82" marker-end="url(#ar)"/>
<circle class="l pulse" cx="405" cy="98" r="7"/><path class="ln" d="M378 98H398"/>
<text x="405" y="124" class="l" font-size="11" text-anchor="middle" >gap</text>
<text x="290" y="62" class="d" font-size="10" text-anchor="middle" >re-search</text>
<text x="18" y="142" class="d" font-size="11" text-anchor="start" >papers  &gt;  methods  &gt;  evidence-checked gaps</text>
</svg>
