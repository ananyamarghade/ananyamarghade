<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="t d">
<title id="t">Ananya Marghade, developer profile</title>
<desc id="d">Terminal-style profile panel. Left: ASCII art of a layered neural network. Right: ananya@marghade. B.Tech CSE, AI and Data Science. Focus on AI engineering, software, data systems and research. Building agents, forecasting and decision support. Seeking SDE and AI/ML internships and research. DimensionAI, lead on Aasha. Languages: Python, Java, TypeScript, JavaScript, C, SQL, Assembly, Lex. ML: LangGraph, Random Forest, OpenCV, Dlib. Web: FastAPI, Gradio, Next.js, Tailwind, Supabase. GitHub snapshot 2026-10-11: 17 public repos, 641 contributions in the last 12 months, 3 followers. Contact: github.com/ananyamarghade.</desc>
