<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
<title id="t">SenentialAI app structure diagram</title>
<desc id="d">Five app sections (analyze, dashboard, history, reports, settings) connected to a Supabase database, drawn from the repository structure.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#14181b}.d{fill:#566168}.c{fill:#0f766e}.l{fill:#4d7c0f}
.ln{fill:none;stroke:#cfd8dc;stroke-width:1}
.ar{fill:none;stroke:#566168;stroke-width:1.4}
.sc{fill:none;stroke:#0f766e;stroke-width:2;stroke-linejoin:round}
.box{fill:#ffffff;stroke:#cfd8dc;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#0f766e;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#4d7c0f}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#566168"/></marker></defs>
<rect width="900" height="300" fill="#fbfbf9"/>
<rect x=".5" y=".5" width="899" height="299" fill="#fbfbf9" stroke="#cfd8dc"/>
<path class="ln" d="M310 30V270"/>
<text x="40" y="52" class="d" font-size="14" text-anchor="start" >web app</text>
<text class="serif t" x="40" y="104" font-size="34">SenentialAI</text>
<rect x="40" y="184" width="177" height="26" fill="none" stroke="#4d7c0f" stroke-opacity=".7"/>
<text x="51" y="201" class="l" font-size="12" text-anchor="start" >web app, undocumented</text>
<text x="40" y="244" class="d" font-size="13" text-anchor="start" >Next.js, TypeScript</text>
<text x="40" y="264" class="d" font-size="13" text-anchor="start" >Tailwind, Supabase</text>
<path class="ln" d="M386 82H810"/>
<path class="flow" pathLength="100" d="M386 82H810" style="animation-delay:0.0s;"/>
<path class="ln" d="M386 82V92"/>
<rect class="box" x="340" y="92" width="92" height="44"/><text x="386.0" y="118.5" class="t" font-size="13" text-anchor="middle">analyze</text>
<path class="ln" d="M492 82V92"/>
<rect class="box" x="446" y="92" width="92" height="44"/><text x="492.0" y="118.5" class="t" font-size="13" text-anchor="middle">dashboard</text>
<path class="ln" d="M598 82V92"/>
<rect class="box" x="552" y="92" width="92" height="44"/><text x="598.0" y="118.5" class="t" font-size="13" text-anchor="middle">history</text>
<path class="ln" d="M704 82V92"/>
<rect class="box" x="658" y="92" width="92" height="44"/><text x="704.0" y="118.5" class="t" font-size="13" text-anchor="middle">reports</text>
<path class="ln" d="M810 82V92"/>
<rect class="box" x="764" y="92" width="92" height="44"/><text x="810.0" y="118.5" class="t" font-size="13" text-anchor="middle">settings</text>
<path class="ln" d="M386 136V164H810V136"/>
<path class="ar dash" d="M580 164V184" marker-end="url(#ar)"/>
<path class="box" d="M526 196V230A54 10 0 0 0 634 230V196"/>
<ellipse class="box" cx="580" cy="196" rx="54" ry="10"/>
<text x="580" y="221" class="t" font-size="12" text-anchor="middle" >Supabase</text>
<text x="656" y="218" class="d" font-size="12" text-anchor="start" >supabase/migrations</text>
<text x="340" y="276" class="d" font-size="12" text-anchor="start" >README is empty; behaviour is not described here</text>
</svg>
