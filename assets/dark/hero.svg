<title id="t">Ananya Marghade, profile header</title>
<desc id="d">Header with the name Ananya Marghade, two typed lines (B.Tech CSE with AI and Data Science; agents, forecasting and decision support), a small animated neural-network graph and a signal trace along the bottom.</desc>
<style>
