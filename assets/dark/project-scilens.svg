<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
<title id="t">SciLens pipeline diagram</title>
<desc id="d">Five stages (search, extract, landscape, gaps, critic) with a feedback loop from the evidence critic back to targeted re-search, ending in a research proposal export.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#e8e6df}.d{fill:#8a979b}.c{fill:#4fd1c5}.l{fill:#b8e63c}
.ln{fill:none;stroke:#26343a;stroke-width:1}
.ar{fill:none;stroke:#8a979b;stroke-width:1.4}
.sc{fill:none;stroke:#4fd1c5;stroke-width:2;stroke-linejoin:round}
.box{fill:#111517;stroke:#26343a;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#4fd1c5;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#b8e63c}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#8a979b"/></marker></defs>
<rect width="900" height="300" fill="#0b0d0e"/>
<rect x=".5" y=".5" width="899" height="299" fill="#0b0d0e" stroke="#26343a"/>
<path class="ln" d="M310 30V270"/>
<text x="40" y="52" class="d" font-size="14" text-anchor="start" >research agent</text>
<text class="serif t" x="40" y="104" font-size="34">SciLens</text>
<rect x="40" y="184" width="140" height="26" fill="none" stroke="#b8e63c" stroke-opacity=".7"/>
<text x="51" y="201" class="l" font-size="12" text-anchor="start" >live demo linked</text>
<text x="40" y="244" class="d" font-size="13" text-anchor="start" >Python, FastAPI, LangGraph</text>
<text x="40" y="264" class="d" font-size="13" text-anchor="start" >OpenAlex, arXiv, CrossRef</text>
<path class="ln" d="M384 82H816"/>
<path class="flow" pathLength="100" d="M384 82H816" style="animation-delay:0.0s;"/>
<path class="ln" d="M384 82V96"/>
<rect class="box" x="340" y="96" width="88" height="44"/><text x="384.0" y="122.5" class="t" font-size="13" text-anchor="middle">search</text>
<path class="ar" d="M430 118H446" marker-end="url(#ar)"/>
<path class="ln" d="M492 82V96"/>
<rect class="box" x="448" y="96" width="88" height="44"/><text x="492.0" y="122.5" class="t" font-size="13" text-anchor="middle">extract</text>
<path class="ar" d="M538 118H554" marker-end="url(#ar)"/>
<path class="ln" d="M600 82V96"/>
<rect class="box" x="556" y="96" width="88" height="44"/><text x="600.0" y="122.5" class="t" font-size="13" text-anchor="middle">landscape</text>
<path class="ar" d="M646 118H662" marker-end="url(#ar)"/>
<path class="ln" d="M708 82V96"/>
<rect class="box" x="664" y="96" width="88" height="44"/><text x="708.0" y="122.5" class="t" font-size="13" text-anchor="middle">gaps</text>
<path class="ar" d="M754 118H770" marker-end="url(#ar)"/>
<path class="ln" d="M816 82V96"/>
<rect class="box" x="772" y="96" width="88" height="44"/><text x="816.0" y="122.5" class="t" font-size="13" text-anchor="middle">critic</text>
<path class="ar dash" d="M816 140V196H384V140" marker-end="url(#ar)"/>
<path class="flow lm" pathLength="100" d="M816 140V196H384V140" style="animation-delay:1.2s;"/>
<text x="600" y="220" class="d" font-size="13" text-anchor="middle" >investigator re-searches until validated or capped</text>
<text x="856" y="256" class="c" font-size="13" text-anchor="end" >validated gaps  &gt;  research proposal</text>
</svg>
