<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-labelledby="t d">
<title id="t">Hospital OPD forecasting</title>
<desc id="d">Illustrative: daily hospital load rising toward an overload threshold, with a three-day-ahead question marker.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#e8e6df}.d{fill:#8a979b}.c{fill:#4fd1c5}.l{fill:#b8e63c}
.ln{fill:none;stroke:#26343a;stroke-width:1}
.ar{fill:none;stroke:#8a979b;stroke-width:1.4}
.sc{fill:none;stroke:#4fd1c5;stroke-width:2;stroke-linejoin:round}
.box{fill:#111517;stroke:#26343a;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#4fd1c5;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#b8e63c}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.blink{animation:blink 1.1s steps(1) infinite}
.fadein{animation:rise .9s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#8a979b"/></marker></defs>

<rect x=".5" y=".5" width="439" height="149" rx="8" fill="#111517" stroke="#26343a"/>
<text x="18" y="26" class="l" font-size="12" text-anchor="start" >checkpoint_02</text>
<text x="422" y="26" class="d" font-size="12" text-anchor="end" >forecasting</text>
<path class="ln" d="M0 38H440"/>
<rect x="266" y="48" width="144" height="72" fill="#4fd1c5" fill-opacity=".08"/>
<path class="ln dash" d="M18 70H422"/><text x="24" y="64" class="d" font-size="11" text-anchor="start" >overload threshold</text>
<clipPath id="rv"><rect class="ty" x="0" y="40" width="440" height="90" style="animation-duration:2.4s;animation-delay:0.3s;animation-timing-function:ease-out"/></clipPath><g clip-path="url(#rv)"><path class="sc" d="M24.0 100.0 C27.7 98.7 38.7 92.7 46.0 92.0 C53.3 91.3 60.7 97.3 68.0 96.0 C75.3 94.7 82.7 85.0 90.0 84.0 C97.3 83.0 104.7 91.7 112.0 90.0 C119.3 88.3 126.7 75.7 134.0 74.0 C141.3 72.3 148.7 81.3 156.0 80.0 C163.3 78.7 170.7 67.3 178.0 66.0 C185.3 64.7 192.7 73.0 200.0 72.0 C207.3 71.0 214.7 60.7 222.0 60.0 C229.3 59.3 236.7 68.3 244.0 68.0 C251.3 67.7 262.3 59.7 266.0 58.0"/></g>
<path class="ln dash" d="M266 58L384 52" stroke="#b8e63c"/>
<circle class="l pulse" cx="384" cy="52" r="6"/><text x="372" y="56" class="l" font-size="11" text-anchor="end" >+3 days?</text>
<path class="ln" d="M18 120H422"/><text x="24" y="142" class="d" font-size="11" text-anchor="start" >daily load  &gt;  rolling features  &gt;  overload 3 days ahead</text>
</svg>
