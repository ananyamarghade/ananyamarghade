<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
<title id="t">OPD early warning diagram</title>
<desc id="d">A line of daily hospital load up to today (t), a shaded three-day horizon, and an open question marker on the overload threshold at t plus three days. The curve is illustrative, not project data.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#e8e6df}.d{fill:#8a979b}.c{fill:#4fd1c5}.l{fill:#b8e63c}
.ln{fill:none;stroke:#26343a;stroke-width:1}
.ar{fill:none;stroke:#8a979b;stroke-width:1.4}
.sc{fill:none;stroke:#4fd1c5;stroke-width:2;stroke-linejoin:round}
.box{fill:#111517;stroke:#26343a;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#4fd1c5;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#b8e63c}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#8a979b"/></marker></defs>
<rect width="900" height="300" fill="#0b0d0e"/>
<rect x=".5" y=".5" width="899" height="299" fill="#0b0d0e" stroke="#26343a"/>
<path class="ln" d="M310 30V270"/>
<text x="40" y="52" class="d" font-size="14" text-anchor="start" >forecasting</text>
<text class="serif t" x="40" y="104" font-size="34">Hospital OPD</text>
<text class="serif t" x="40" y="144" font-size="34">Early Warning</text>
<rect x="40" y="184" width="103" height="26" fill="none" stroke="#b8e63c" stroke-opacity=".7"/>
<text x="51" y="201" class="l" font-size="12" text-anchor="start" >ml pipeline</text>
<text x="40" y="244" class="d" font-size="13" text-anchor="start" >Python, Random Forest</text>
<text x="40" y="264" class="d" font-size="13" text-anchor="start" >time-based split</text>
<rect x="700" y="60" width="160" height="170" fill="#4fd1c5" fill-opacity=".07" stroke="#26343a" class="dash"/>
<path class="ln" d="M340 230H860"/>
<path d="M340 100H860" stroke="#b8e63c" stroke-opacity=".7" stroke-dasharray="4 5" fill="none"/>
<text x="344" y="92" class="l" font-size="12" text-anchor="start" >overload threshold</text>
<path class="sc" d="M340 172L358 164L376 173L394 158L412 143L430 166L448 188L466 178L484 175L502 193L520 188L538 154L556 143L574 151L592 136L610 117L628 135L646 159L664 152L682 148L700 168"/>
<path class="flow" pathLength="100" d="M340 172L358 164L376 173L394 158L412 143L430 166L448 188L466 178L484 175L502 193L520 188L538 154L556 143L574 151L592 136L610 117L628 135L646 159L664 152L682 148L700 168" style="animation-delay:0s;stroke-dasharray:6 94;"/>
<path d="M700 168C760 168 800 100 860 100" fill="none" stroke="#4fd1c5" stroke-opacity=".6" stroke-dasharray="4 5"/>
<path class="ar" d="M700 60V230"/>
<circle cx="860" cy="100" r="6" fill="none" stroke="#b8e63c" stroke-width="2" class="pulse"/>
<text x="846" y="84" class="l" font-size="18" text-anchor="end" >?</text>
<text x="700" y="250" class="t" font-size="13" text-anchor="middle" >t</text>
<text x="860" y="250" class="t" font-size="13" text-anchor="end" >t + 3 days</text>
<text x="340" y="276" class="d" font-size="12" text-anchor="start" >illustrative shape, not project data</text>
</svg>
