<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
<title id="t">Technology system map</title>
<desc id="d">Four columns (languages, ML and build, backend and UI, data and ship) with project routes drawn through them. SciLens: Python, LangGraph, FastAPI and Gradio, Vercel. OPD forecasting and drowsiness detection: Python to Random Forest and OpenCV with Dlib. SenentialAI: TypeScript, Next.js, Supabase and Netlify. LRU cache: Java and Maven. C, SQL and JavaScript are from coursework labs.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#e8e6df}.d{fill:#8a979b}.c{fill:#4fd1c5}.l{fill:#b8e63c}
.ln{fill:none;stroke:#26343a;stroke-width:1}
.ar{fill:none;stroke:#8a979b;stroke-width:1.4}
.sc{fill:none;stroke:#4fd1c5;stroke-width:2;stroke-linejoin:round}
.box{fill:#111517;stroke:#26343a;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#4fd1c5;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#b8e63c}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.cell{animation:cin .5s ease-out both}
@keyframes cin{from{opacity:0}to{opacity:1}}
</style>
