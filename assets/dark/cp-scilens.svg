<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-labelledby="t d">
<title id="t">SciLens pipeline</title>
<desc id="d">ASCII diagram. Four sources (openalex, semantic scholar, crossref, arxiv) feed extract, then critic, then gap, with a re-search loop from critic back to extract.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.t{fill:#e8e6df}.d{fill:#8a979b}.c{fill:#4fd1c5}.l{fill:#b8e63c}
.ln{fill:none;stroke:#26343a;stroke-width:1}
.ar{fill:none;stroke:#8a979b;stroke-width:1.4}
.sc{fill:none;stroke:#4fd1c5;stroke-width:2;stroke-linejoin:round}
.box{fill:#111517;stroke:#26343a;stroke-width:1.2}
.dash{stroke-dasharray:5 4}
.flow{fill:none;stroke:#4fd1c5;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 92;animation:flow 3.4s linear infinite}
.lm{stroke:#b8e63c}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ty{transform-box:fill-box;transform-origin:left center;animation:type 2.2s steps(28) both}
.blink{animation:blink 1.1s steps(1) infinite}
.fadein{animation:rise .9s ease-out both}
.seq{animation:seq 3.6s ease-in-out infinite}
.s1{animation-delay:.6s}.s2{animation-delay:1.2s}.s3{animation-delay:1.8s}
.altA{opacity:0;animation:altA 7s ease-in-out infinite}
.altB{animation:altB 7s ease-in-out infinite}
.scan{animation:scan 6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:-92}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes seq{0%,100%{opacity:.4}15%,45%{opacity:1}}
@keyframes altA{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes altB{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(520px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#8a979b"/></marker></defs>

<rect x=".5" y=".5" width="439" height="149" rx="8" fill="#111517" stroke="#26343a"/>
<text x="18" y="26" class="l" font-size="12" text-anchor="start" >checkpoint_01</text>
<text x="422" y="26" class="d" font-size="12" text-anchor="end" >research agent</text>
<path class="ln" d="M0 38H440"/>
<text y="70" font-size="13"><tspan x="20.0" class="t">openalex</tspan><tspan x="90.2" class="d">--.</tspan></text>
<text y="87" font-size="13"><tspan x="20.0" class="t">semantic</tspan><tspan x="90.2" class="d">--+</tspan></text>
<text y="104" font-size="13"><tspan x="20.0" class="t">crossref</tspan><tspan x="90.2" class="d">--+--&gt;</tspan><tspan x="144.8" class="t seq">[extract]</tspan><tspan x="222.8" class="d">--&gt;</tspan><tspan x="254.0" class="c seq s1">[critic]</tspan><tspan x="324.2" class="d">--&gt;</tspan><tspan x="355.4" class="l seq s2">gap</tspan></text>
<text y="121" font-size="13"><tspan x="20.0" class="t">arxiv   </tspan><tspan x="90.2" class="d">--&#x27;</tspan><tspan x="176.0" class="d">^</tspan><tspan x="285.2" class="d">|</tspan></text>
<text y="138" font-size="13"><tspan x="176.0" class="d">&#x27;</tspan><tspan x="183.8" class="l seq s3">- re-search -</tspan><tspan x="285.2" class="d">&#x27;</tspan></text>
</svg>
